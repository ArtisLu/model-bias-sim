# Confidence belt (test inversion over a grid of true effects). Kept apart from config.yml
# on purpose: every target depends on cfg, so a key added there would rerun the replicates.
# Profiles follow R_CONFIG_ACTIVE; a profile not listed here uses `default`.

default:
  # Grid: Chebyshev-Lobatto nodes in psi over the range where CI endpoints fall (observed CI and
  # the tail quantiles of the main replicates' Wald endpoints), mapped to theta via psi(theta)
  n_nodes: 5         # nodes; together with theta* and 0 they carry the quantile curves
  tail: 0.005        # share of replicate endpoints allowed beyond the range, per side
  expand: 0.1        # widening of the range on each side (belt endpoints differ from Wald)
  min_gap: 0.05      # psi distance below which a node is dropped in favour of a main scenario
  bound: 4           # nodes lie within |theta| <= bound; psi is evaluated at +-bound and +-bound / 2
  anchor_n_rep: 3    # large datasets per anchor (they only place the nodes)
  # Adaptive replicates per node: B_start first, then batches until the 2.5% and 97.5%
  # quantiles of T reach target_mcse (theta* and 0 reuse the main replicates)
  B_start: 1000
  B_max: 5000
  target_mcse: 0.05
  truth_n_rep: 12    # large datasets per node truth (truth MCSE ~0.007 log-HR)
  degree: 2          # polynomial in psi for the quantile curves of T

smoke:
  n_nodes: 3
  anchor_n_rep: 1
  B_start: 10
  B_max: 20
  target_mcse: 0.01
  truth_n_rep: 1
  degree: 1

b100k:
  B_max: 10000
  target_mcse: 0.035
  truth_n_rep: 24
