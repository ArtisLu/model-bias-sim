# Modelling-bias QBA simulation: all tunables live here (simulation_setup.md, Sec. 2).
# Profiles: default = Maringe-only production run (paper); smoke = quick end-to-end check;
# two_datasets = Maringe + SynPUF comparison (R_CONFIG_ACTIVE=two_datasets).

default:
  # Datasets run by the pipeline; SynPUF stays defined (and tested) but is not run
  active_datasets: ["maringe"]
  seed_master: 20261002
  seed_truth: 20261003
  workers: 2
  B: 10000           # replicates per scenario; coverage MCSE ~0.2%, bias MCSE ~0.002 (ADEMP P)
  batch_size: 250

  # Large-sample truth: pipeline limit on stacked copies of the base data (~50,000 patients)
  truth:
    n_target: 50000    # patients per large dataset (~1.5 GB per worker)
    n_rep: 24          # independent large datasets averaged at theta* and 0
  # Search for theta* such that the CCW truth equals the observed estimate (paper Step 3)
  calibration:
    n_rep: 12          # truths during the search (common random numbers)
    max_iter: 4
    tol: 0.005         # log-HR
    bound: 3           # |theta| cap

  datasets:
    maringe:
      label: "Maringe lung cancer (n = 200)"
      file: "data/raw/lungcancer.csv"
      contrast: "Surgery within 6 months vs no surgery within 6 months"
      arm1: "surgery"            # strategy coded arm = 1 (HR < 1 favours it)
      outcome_label: "Death"
      pipeline:
        design: "grace_vs_none"
        grace: 182.62            # days
        cens_covariates: ["age_c", "sex", "perf", "stage", "deprivation", "charlson", "emergency"]
        conf_level: 0.95
      dgm:
        covariates: ["age_c", "sex", "perf", "stage", "deprivation", "charlson", "emergency"]
        age_unit: 5              # age_c = (age - 80) / 5 in data.R
      # Administrative censoring at 1 year only: no loss to follow-up to model
      censoring:
        model: "none"
    synpuf:
      label: "SynPUF MI cohort (n = 1,590)"
      file: "data/raw/synpuf_baseccwcohort.sas7bdat"
      contrast: "Treatment start within 90 days vs within 30 days of MI discharge"
      arm1: "the 90-day strategy"
      outcome_label: "Readmission or death"
      horizon: 180               # days; tutorial follow-up window
      pipeline:
        design: "window_vs_window"
        windows: [30, 90]        # reference window first
        recent_days: 7           # tutorial: only starters in the last 7 days are up-weighted
        cens_covariates: ["age_c", "sex", "renal"]
        conf_level: 0.95
      dgm:
        covariates: ["age_c", "sex", "renal", "nonwhite"]
        age_unit: 10             # age_c = (age - 75) / 10 in data.R
      # Loss to follow-up before the horizon: Weibull PH with the event/censoring indicator
      # switched, treatment time-varying (paper Section 2.3); "fixed" keeps observed times
      censoring:
        model: "weibull"
        covariates: ["age_c", "sex", "renal", "nonwhite"]

smoke:
  active_datasets: ["maringe", "synpuf"]
  workers: 1
  B: 20
  batch_size: 10
  truth:
    n_target: 2000
    n_rep: 2
  calibration:
    n_rep: 1
    max_iter: 2
    tol: 0.05
    bound: 3

two_datasets:
  active_datasets: ["maringe", "synpuf"]
  render_report: true   # Quarto colleague report (needs the Quarto CLI)
